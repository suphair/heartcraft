<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сердцекрафт</title>
<style>
  :root { --edge: #c2185b; --plate: #fff0f7; --ink: #5a1838; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(#ff9fcf, #ffe0ef); }
  .box { width: 100%; max-width: 440px; background: #fff7fb; border: 4px solid var(--edge); border-radius: 22px;
    padding: 22px; text-align: center; box-shadow: 0 6px 0 rgba(90, 24, 56, .35); }
  h1 { margin: 0 0 6px; font-size: 32px; }
  p { margin: 0 0 18px; }
  a { display: block; margin-top: 14px; padding: 16px; border: 3px solid var(--edge); border-radius: 16px;
    background: var(--plate); color: inherit; font-size: 20px; font-weight: bold; text-decoration: none;
    box-shadow: 0 4px 0 rgba(90, 24, 56, .35); }
  a.main { background: #ff7fb6; color: #fff; }
  a:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(90, 24, 56, .35); }
  small { display: block; margin-top: 4px; font-size: 14px; font-weight: normal; }
</style>
</head>
<body>
<div class="box">
  <h1>💖 Сердцекрафт</h1>
  <p>Во что играем?</p>
  <a class="main" id="net" href="http://192.168.1.1:8094/">🌐 Сетевая игра
    <small>вместе с другими, по логину и коду мира</small></a>
  <a href="https://suphair.github.io/heartcraft/">🎮 Одиночная игра
    <small>одному, мир хранится в этом браузере</small></a>
</div>
<script>
// From outside the home network the network game is reached through its KeenDNS name.
if (location.hostname.endsWith(".keenetic.link")) {
  document.querySelector("#net").href = "https://hcplay.suphair.keenetic.link/";
}
</script>
</body>
</html>

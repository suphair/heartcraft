# The start page of the game on the router itself: it works while the Windows game server is off.
server.document-root = "/opt/heartcraft/www"
server.port = 8092
server.pid-file = "/opt/heartcraft/lighttpd.pid"
index-file.names = ("index.html")
mimetype.assign = (".html" => "text/html; charset=utf-8")
